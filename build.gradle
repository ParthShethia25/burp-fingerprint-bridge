plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0-beta12'
}

group = 'io.github.parthshethia25'
version = '0.1.1'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

repositories { mavenCentral() }

dependencies {
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2026.7'
    implementation 'com.google.code.gson:gson:2.13.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

shadowJar {
    archiveBaseName.set('burp-fingerprint-bridge')
    archiveClassifier.set((findProperty('bundlePlatform') ?: '').toString())
    relocate 'com.google.gson', 'io.github.parthshethia25.bridge.shaded.gson'
    manifest { attributes('Extension-Name': 'Fingerprint Bridge') }
}

processResources {
    from('python') { include 'worker.py', 'requirements.txt'; into 'python' }
    if (project.hasProperty('bundlePlatform')) {
        from('native') { include 'bridge-worker', 'bridge-worker.exe'; into 'native' }
    }
}

build.dependsOn shadowJar
