name: Release bundled extensions
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  bundle:
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r python/requirements.txt pyinstaller==6.14.1
      - name: Test worker
        run: python -m unittest discover -s python -p "test_*.py" -v
      - name: Build frozen worker
        run: python -m PyInstaller --noconfirm --clean --onefile --name bridge-worker --distpath native --workpath build/pyinstaller --specpath build/pyinstaller --collect-all curl_cffi --collect-all fastapi --collect-all pydantic --collect-all uvicorn --collect-all starlette python/worker.py
      - name: Check frozen worker
        run: python python/smoke_bundle.py
      - name: Build importable JAR (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat shadowJar -PbundlePlatform=${{ matrix.platform }}
      - name: Build importable JAR (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash ./gradlew shadowJar -PbundlePlatform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: burp-fingerprint-bridge-${{ matrix.platform }}
          path: build/libs/*-${{ matrix.platform }}.jar
  release:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: burp-fingerprint-bridge-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*.jar
          generate_release_notes: true
